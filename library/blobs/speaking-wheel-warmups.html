<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Speaking Prompt Spinner & 60s Challenge</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #faf7f2;
      color: #1f2937;
      padding: 24px;
      display: flex;
      justify-content: center;
    }
    .wrap {
      width: 100%;
      max-width: 820px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      align-items: center;
    }
    @media (max-width: 700px) { .wrap { grid-template-columns: 1fr; } }
    .wheel-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      background: #fff;
      padding: 24px;
      border-radius: 20px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }
    .pointer {
      width: 0; height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-top: 22px solid #dc2626;
      margin-bottom: -6px;
      z-index: 2;
    }
    canvas {
      max-width: 100%;
      transition: transform 3.8s cubic-bezier(0.17, 0.67, 0.12, 0.99);
    }
    .panel {
      background: #fff;
      padding: 24px;
      border-radius: 20px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }
    h1 { margin: 0 0 6px; font-size: 20px; }
    .sub { margin: 0 0 18px; color: #6b7280; font-size: 13px; }
    .prompt-card {
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 14px;
      padding: 18px;
      min-height: 110px;
      display: flex;
      align-items: center;
      font-size: 17px;
      font-weight: 600;
      line-height: 1.45;
      color: #78350f;
      margin-bottom: 16px;
    }
    .row { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
    button {
      border: none;
      border-radius: 10px;
      padding: 11px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .spin-btn { background: #0d9488; color: #fff; margin-top: 14px; width: 100%; }
    .spin-btn:hover { background: #0f766e; }
    .timer-btn { background: #1f2937; color: #fff; }
    .timer-display {
      font-variant-numeric: tabular-nums;
      font-size: 24px;
      font-weight: 700;
      color: #0f172a;
      margin-left: auto;
    }
    .add-row { display: flex; gap: 8px; margin-top: 12px; }
    input {
      flex: 1;
      padding: 9px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 13px;
    }
    .add-btn { background: #e5e7eb; color: #111827; padding: 9px 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="wheel-box">
      <div class="pointer"></div>
      <canvas id="wheel" width="320" height="320"></canvas>
      <button class="spin-btn" id="spinBtn">Spin the Topic Wheel</button>
    </div>
    <div class="panel">
      <h1>Speaking Warm-Up</h1>
      <p class="sub">Spin for a conversation prompt and speak non-stop for 60 seconds!</p>
      <div class="prompt-card" id="promptBox">Click "Spin the Topic Wheel" to pick a speaking prompt.</div>
      <div class="row">
        <button class="timer-btn" id="timerBtn">Start 60s Timer</button>
        <div class="timer-display" id="timerDisplay">01:00</div>
      </div>
      <div class="add-row">
        <input id="customTopic" placeholder="Add your own topic (e.g. Dream job)..." />
        <button class="add-btn" id="addBtn">Add</button>
      </div>
    </div>
  </div>
  <script>
    const PROMPTS = [
      { label: "Travel", text: "Describe the most memorable trip you have ever taken. What made it special?" },
      { label: "Tech", text: "If you had to live without one digital app for a month, which would be hardest to give up?" },
      { label: "Food", text: "Teach me how to cook your favorite comfort meal in 4 simple steps." },
      { label: "Morning", text: "Walk me through your ideal weekend morning from waking up to lunch." },
      { label: "Skill", text: "What is a skill you wish you had learned five years ago, and why?" },
      { label: "Movies", text: "Recommend a film or series everyone should watch at least once (no spoilers!)." },
      { label: "City vs Nature", text: "Would you rather live in a bustling capital city or a quiet mountain town?" },
      { label: "Childhood", text: "Tell a funny story from your school years that you still remember." }
    ];
    const COLORS = ["#0d9488", "#f59e0b", "#4f46e5", "#ec4899", "#0ea5e9", "#8b5cf6", "#10b981", "#f97316"];
    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');
    let rotation = 0;
    let seconds = 60;
    let timerId = null;

    function drawWheel() {
      const n = PROMPTS.length;
      const arc = (2 * Math.PI) / n;
      const cx = 160, cy = 160, r = 152;
      ctx.clearRect(0, 0, 320, 320);
      PROMPTS.forEach((p, i) => {
        const start = i * arc - Math.PI / 2;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, r, start, start + arc);
        ctx.fillStyle = COLORS[i % COLORS.length];
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(start + arc / 2);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 13px sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText(p.label.slice(0, 14), r - 14, 5);
        ctx.restore();
      });
    }

    document.getElementById('spinBtn').onclick = () => {
      const extra = 1080 + Math.floor(Math.random() * 720);
      rotation += extra;
      canvas.style.transform = `rotate(${rotation}deg)`;
      const n = PROMPTS.length;
      const degPerSlice = 360 / n;
      const normalized = (360 - (rotation % 360)) % 360;
      const idx = Math.floor(normalized / degPerSlice) % n;
      setTimeout(() => {
        document.getElementById('promptBox').textContent = PROMPTS[idx].text;
      }, 3850);
    };

    document.getElementById('timerBtn').onclick = () => {
      if (timerId) {
        clearInterval(timerId);
        timerId = null;
        seconds = 60;
        document.getElementById('timerDisplay').textContent = '01:00';
        document.getElementById('timerBtn').textContent = 'Start 60s Timer';
        return;
      }
      document.getElementById('timerBtn').textContent = 'Reset Timer';
      timerId = setInterval(() => {
        seconds--;
        const mm = String(Math.floor(seconds / 60)).padStart(2, '0');
        const ss = String(seconds % 60).padStart(2, '0');
        document.getElementById('timerDisplay').textContent = `${mm}:${ss}`;
        if (seconds <= 0) {
          clearInterval(timerId);
          timerId = null;
          document.getElementById('timerDisplay').textContent = "Time's up!";
        }
      }, 1000);
    };

    document.getElementById('addBtn').onclick = () => {
      const inp = document.getElementById('customTopic');
      const val = inp.value.trim();
      if (!val) return;
      PROMPTS.push({ label: val.slice(0, 12), text: `Speak for 60 seconds about: ${val}` });
      inp.value = '';
      drawWheel();
    };

    drawWheel();
  </script>
</body>
</html>
